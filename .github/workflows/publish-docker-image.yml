name: Publish Docker image (GHCR)

on:
  push:
    branches:
      - main
      - master
      - release
      - staging
      - dev
      - develop
  workflow_dispatch: {}

env:
  # Publishes to: ghcr.io/<owner>/<repo>/<image>:<dev|staging|release>
  # Change this if you want a different image name under the repo namespace.
  IMAGE_NAME: frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            main|master|release) TAG="release" ;;
            staging) TAG="staging" ;;
            dev|develop) TAG="dev" ;;
            *)
              echo "Unsupported branch '${GITHUB_REF_NAME}'. Expected dev/develop/staging/main/master/release." >&2
              exit 1
              ;;
          esac

          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_lc="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${repo_lc}/${image_lc}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


